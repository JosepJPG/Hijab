<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowHijab - Toko Hijab Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #fef1f5; color: #4a4a4a; display: flex; justify-content: center; padding: 20px 10px; }
        .container { max-width: 450px; width: 100%; background: #ffffff; border-radius: 25px; box-shadow: 0 10px 30px rgba(224, 82, 117, 0.15); overflow: hidden; padding-bottom: 30px; }
        header { padding: 25px 20px; text-align: center; background: linear-gradient(135deg, #ff7597, #e05275); color: white; }
        .logo { font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .hero-banner { background: #fff0f3; margin: 20px 15px; padding: 20px; text-align: center; border-radius: 15px; border-left: 5px solid #e05275; }
        .hero-banner h1 { color: #cc3b5e; font-size: 18px; margin-bottom: 8px; }
        .hero-banner p { color: #666; font-size: 13px; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 15px; }
        .product-card { background: #fff; border: 1px solid #ffe1e9; border-radius: 15px; padding: 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .product-image { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; }
        .product-title { font-size: 14px; font-weight: bold; margin: 8px 0; min-height: 35px; color: #333; }
        .product-price { font-size: 14px; font-weight: bold; color: #e05275; margin-bottom: 8px; }
        
        .btn-buy { 
            display: block;
            background: linear-gradient(135deg, #ff7597, #e05275); 
            color: white; 
            padding: 10px; 
            border-radius: 25px; 
            font-size: 13px; 
            font-weight: bold; 
            text-decoration: none;
            width: 100%; 
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">💖 GLOWHIJAB.CO</div>
        </header>

        <section class="hero-banner">
            <h1>Pashmina & Hijab Instan Premium</h1>
            <p>Bahan super adem, tegak paripurna, nyaman sehari-hari ✨</p>
        </section>

        <main class="product-grid">
            <!-- Produk 1 -->
            <div class="product-card">
                <img src="img/Ceruty.jpeg" class="product-image" alt="Pashmina Ceruty">
                <div class="product-title">Pashmina Ceruty Baby Doll</div>
                <div class="product-price">Rp 25.000</div>
                <a href="beli.html?nama=Pashmina%20Ceruty%20Baby%20Doll&harga=25000" class="btn-buy">Beli Sekarang</a>
            </div>

            <!-- Produk 2 -->
            <div class="product-card">
                <img src="img/BergoInstan.jpeg" class="product-image" alt="Hijab Instan">
                <div class="product-title">Hijab Bergo Instan Jersey</div>
                <div class="product-price">Rp 30.000</div>
                <a href="beli.html?nama=Hijab%20Instan%20Jersey&harga=30000" class="btn-buy">Beli Sekarang</a>
            </div>

            <!-- Produk 3 -->
            <div class="product-card">
                <img src="img/BellaSquare.jpeg" class="product-image" alt="Bella Square">
                <div class="product-title">Bella Square Polos</div>
                <div class="product-price">Rp 18.000</div>
                <a href="beli.html?nama=Bella%20Square%20Polos&harga=18000" class="btn-buy">Beli Sekarang</a>
            </div>

            <!-- Produk 4 -->
            <div class="product-card">
                <img src="img/vischose.jpeg" class="product-image" alt="Pashmina Plisket">
                <div class="product-title">Pashmina Vischose Full</div>
                <div class="product-price">Rp 48.000</div>
                <a href="beli.html?nama=Pashmina%20Plisket%20Full&harga=28000" class="btn-buy">Beli Sekarang</a>
            </div>
        </main>
    </div>

</body>
</html>
