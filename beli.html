<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beli Produk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: #FFF7FA;
            font-family: Poppins, sans-serif;
        }

        .box{
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .btn-wa{
            background: #25D366;
            color: white;
            border: none;
        }

        .btn-wa:hover{
            background: #1ebe5d;
            color: white;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box">

            <h2 class="mb-4 text-center">
                Detail Pesanan
            </h2>

            <p>
                <strong>Produk:</strong>
                <span id="namaProduk"></span>
            </p>

            <p>
                <strong>Harga:</strong>
                Rp <span id="hargaProduk"></span>
            </p>

            <a id="btnWa" href="#" class="btn btn-wa w-100 mt-3">
                Pesan via WhatsApp
            </a>

        </div>

    </div>

    <script>

        const params = new URLSearchParams(window.location.search);

        const produk = params.get("produk") || "Produk tidak diketahui";
        const harga = params.get("harga") || "0";

        const namaProduk = document.getElementById("namaProduk");
        const hargaProduk = document.getElementById("hargaProduk");
        const btnWa = document.getElementById("btnWa");

        namaProduk.innerText = produk;
        hargaProduk.innerText = harga;

        const nomorWa = "6285724536271";

        if (produk !== "Produk tidak diketahui" && harga !== "0") {
            const pesan = `Halo admin, saya ingin membeli ${produk} dengan harga Rp ${harga}`;
            btnWa.href = `https://wa.me/${nomorWa}?text=${encodeURIComponent(pesan)}`;
        } else {
            btnWa.href = "#";
            btnWa.classList.add("disabled");
            btnWa.innerText = "Parameter produk tidak lengkap";
        }

    </script>

</body>
</html>
