<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pembelian - GlowHijab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #fff8fa; color: #444; display: flex; justify-content: center; padding: 20px; }
        .form-container { max-width: 500px; width: 100%; background: #ffffff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(224, 82, 117, 0.1); border: 1px solid #ffe1e9; }
        .back-link { color: #e05275; text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; font-size: 14px; }
        h2 { font-size: 22px; font-weight: bold; color: #cc3b5e; margin-bottom: 25px; border-bottom: 2px solid #ffe1e9; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], select, textarea { padding: 10px; font-size: 14px; border: 1px solid #ffccd7; border-radius: 8px; outline: none; background-color: #fff; }
        input:disabled { background-color: #fdf0f3; color: #777; font-weight: bold; }
        textarea { height: 70px; }
        hr { border: none; border-top: 1px dashed #ffccd7; margin: 25px 0; }
        
        .btn-whatsapp {
            display: block;
            background: linear-gradient(135deg, #25d366, #1ebd58);
            color: white;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <!-- Tombol Kembali -->
        <a href="index.html" class="back-link">← Kembali ke Toko</a>

        <h2>✨ Detail Formulir Pesanan</h2>

        <div class="form-group">
            <label>Hijab Pilihan Anda</label>
            <input type="text" id="hijabPilihan" disabled>
        </div>

        <div class="form-group">
            <label>Harga</label>
            <input type="text" id="hargaHijab" disabled>
        </div>

        <hr>

        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="namaLengkap" placeholder="Masukkan nama Anda">
        </div>

        <div class="form-group">
            <label>Pilihan Warna (10 Warna)</label>
            <select id="warnaJilbab">
                <option value="Hitam">Hitam</option>
                <option value="Putih Bersih">Putih Bersih</option>
                <option value="Milo/Coksu">Milo / Cokelat Susu</option>
                <option value="Navy Blue">Navy Blue</option>
                <option value="Soft Pink">Soft Pink</option>
                <option value="Abu Muda">Abu Muda / Silver</option>
                <option value="Maroon">Maroon</option>
                <option value="Sage Green">Sage Green</option>
                <option value="Mocca">Mocca</option>
                <option value="Khaki">Khaki</option>
            </select>
        </div>

        <div class="form-group">
            <label>Alamat Pengiriman</label>
            <textarea id="alamatPengiriman" placeholder="Tulis alamat lengkap penerima"></textarea>
        </div>
        // INI NOMOR WHATSSAPP ADMIN, BISA DIUBAH SESUAI YANG MBA MAU
        <div class="form-group">
            <label>Nomor WhatsApp</label>
            <input type="text" id="nomorWhatsApp" value="6285846622468" placeholder="6281234567890">
        </div>

        <!-- Tombol Hubung WhatsApp -->
        <a href="#" id="tombolWA" class="btn-whatsapp" target="_blank" onclick="validasiSebelumKirim(event)">💬 Pesan via WhatsApp</a>
    </div>

    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const namaProduk = urlParams.get('nama') || 'Pashmina Ceruty Baby Doll';
        const hargaProduk = urlParams.get('harga') || '25000';

        document.getElementById('hijabPilihan').value = namaProduk;
        document.getElementById('hargaHijab').value = 'Rp ' + new Intl.NumberFormat('id-ID').format(hargaProduk);

        
        function perbaruiLinkWhatsApp() {
            const nama = document.getElementById('namaLengkap').value;
            const warna = document.getElementById('warnaJilbab').value;
            const alamat = document.getElementById('alamatPengiriman').value;
            const nomor = document.getElementById('nomorWhatsApp').value.replace(/\D/g, '');
            
            
            const pesan = `Hai admin GlowHijab, aku mau order koleksi hijab cantiknya. ini detail pesanannya! ✨\n\n` +
                          `🛍 *DETAIL PESANAN*:\n` +
                          `• Produk: ${namaProduk}\n` +
                          `• Harga: Rp ${new Intl.NumberFormat('id-ID').format(hargaProduk)}\n` +
                          `------------------------------------\n` +
                          `👤 *DATA PENERIMA*:\n` +
                          `• Nama Lengkap: ${nama}\n` +
                          `• Pilihan Warna: ${warna}\n` +
                          `• Alamat Kirim: ${alamat}\n\n` +
                          `Mohon segera diproses ya Min. Terima kasih! 💖`;

            const linkLengkap = nomor ? `https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}` : '#';
            document.getElementById('tombolWA').href = linkLengkap;
        }

        // Mencegah kiriman jika form masih kosong
        function validasiSebelumKirim(event) {
            const nama = document.getElementById('namaLengkap').value;
            const alamat = document.getElementById('alamatPengiriman').value;

            if (!nama.trim() || !alamat.trim()) {
                event.preventDefault(); 
                alert("Mohon isi Nama Lengkap dan Alamat Pengiriman terlebih dahulu ya Kak!");
            }
        }

        // Jalankan pelacakan ketikan form
        document.getElementById('namaLengkap').addEventListener('input', perbaruiLinkWhatsApp);
        document.getElementById('warnaJilbab').addEventListener('change', perbaruiLinkWhatsApp);
        document.getElementById('alamatPengiriman').addEventListener('input', perbaruiLinkWhatsApp);
        document.getElementById('nomorWhatsApp').addEventListener('input', perbaruiLinkWhatsApp);
        
        perbaruiLinkWhatsApp();
    </script>
</body>
</html>
