<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - GlowHijab Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: 0.3s ease;
        }

        body{
            background: linear-gradient(to bottom, #FFF7FA, #FFEFF5);
            font-family: 'Poppins', sans-serif;
            color: #5C4B51;
        }

        /* NAVBAR */
        .navbar{
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #f8d7e2;
        }

        .navbar-brand{
            font-weight: 700;
            letter-spacing: 1px;
            color: #D96C95 !important;
            font-size: 1.4rem;
        }

        /* CHECKOUT CONTAINER */
        .checkout-container{
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .checkout-card{
            background: white;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(217,108,149,0.18);
            padding: 50px;
            max-width: 550px;
            width: 100%;
            border: 2px solid #FFD9E7;
        }

        .checkout-card h2{
            color: #B84F77;
            font-weight: 700;
            margin-bottom: 35px;
            text-align: center;
            font-size: 1.9rem;
        }

        .detail-item{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #FFD9E7;
        }

        .detail-item:last-of-type{
            border-bottom: none;
        }

        .detail-label{
            font-weight: 600;
            color: #684A56;
            font-size: 0.95rem;
        }

        .detail-value{
            color: #E75480;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .harga-total{
            background: linear-gradient(135deg, #FFD9E7, #FFF0F5);
            padding: 20px;
            border-radius: 18px;
            margin-top: 25px;
            text-align: center;
        }

        .harga-label{
            color: #8B6B76;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .harga-besar{
            color: #B84F77;
            font-weight: 700;
            font-size: 2rem;
        }

        .btn-wa{
            background: linear-gradient(135deg, #25D366, #1ebe5d);
            color: white;
            border: none;
            font-weight: 600;
            padding: 14px;
            border-radius: 14px;
            margin-top: 30px;
            font-size: 1rem;
            box-shadow: 0 8px 16px rgba(37,211,102,0.25);
        }

        .btn-wa:hover{
            background: linear-gradient(135deg, #1ebe5d, #169949);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(37,211,102,0.35);
        }

        .btn-wa:active{
            transform: translateY(-1px);
        }

        /* FOOTER */
        footer{
            margin-top: 60px;
            padding: 25px;
            text-align: center;
            color: #8B6B76;
            font-size: 0.9rem;
        }

        /* RESPONSIVE */
        @media(max-width:768px){
            .checkout-container{
                padding: 20px;
            }

            .checkout-card{
                padding: 30px 20px;
            }

            .checkout-card h2{
                font-size: 1.5rem;
                margin-bottom: 25px;
            }

            .detail-item{
                padding: 15px 0;
            }

            .detail-label{
                font-size: 0.85rem;
            }

            .detail-value{
                font-size: 0.95rem;
            }

            .harga-besar{
                font-size: 1.6rem;
            }
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                GLOWHIJAB.CO
            </a>
        </div>
    </nav>

    <!-- CHECKOUT SECTION -->
    <div class="checkout-container">
        <div class="checkout-card">

            <h2>✓ Detail Pesanan</h2>

            <div class="detail-item">
                <span class="detail-label">Produk</span>
                <span class="detail-value" id="namaProduk">-</span>
            </div>

            <div class="harga-total">
                <div class="harga-label">Total Harga</div>
                <div class="harga-besar">Rp <span id="hargaProduk">0</span></div>
            </div>

            <a id="btnWa" href="#" class="btn btn-wa w-100">
                💬 Pesan via WhatsApp
            </a>

        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        © 2026 GlowHijab Store. All Rights Reserved.
    </footer>

    <script>

        const params = new URLSearchParams(window.location.search);

        const produk = params.get("produk") || "Produk tidak diketahui";
        const harga = params.get("harga") || "0";

        const namaProduk = document.getElementById("namaProduk");
        const hargaProduk = document.getElementById("hargaProduk");
        const btnWa = document.getElementById("btnWa");

        namaProduk.innerText = produk;
        hargaProduk.innerText = harga;

        const nomorWa = "6285724536271";

        if (produk !== "Produk tidak diketahui" && harga !== "0") {
            const pesan = `Halo admin, saya ingin membeli ${produk} dengan harga Rp ${harga}`;
            btnWa.href = `https://wa.me/${nomorWa}?text=${encodeURIComponent(pesan)}`;
        } else {
            btnWa.href = "#";
            btnWa.classList.add("disabled");
            btnWa.innerText = "⚠️ Parameter produk tidak lengkap";
        }

    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
